function renameTour(){const t=cur(),v=$('#tour_name').value.trim();if(!v)return toast('نام دوره را وارد کنید');const old=t.name;t.name=v;if(old!==v)logSetting(t,'نام مسابقه','تنظیمات مسابقه',`نام مسابقه از «${old}» به «${v}» تغییر کرد`);save();render();toast('نام دوره ویرایش شد')}
function clockValue(v){const a=String(v??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const m=/^(\d{1,2}):(\d{2})$/.exec(a);return m?m[1].padStart(2,'0')+':'+m[2]:a}
function formatClock(el){let v=String(el.value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+':'+v.slice(2);el.value=v}
function cf(k,v){const t=cur(),c=t.cfg,old=c[k];if(k==='time'){v=clockValue(v);if(!/^(?:[01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(v)){toast('ساعت را به شکل ۰۹:۳۰ وارد کنید');return}const a=v.split(':');c.time=a[0].padStart(2,'0')+':'+a[1]}else if(k==='start')c.start=v.trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));else c[k]=Math.max(k==='rest'?0:1,+v||1);if(old!==c[k])logSetting(t,'تنظیم زمان‌بندی','تنظیمات مسابقه',`گزینهٔ ${({start:'تاریخ شروع',time:'ساعت شروع',gap:'فاصلهٔ روزها',fields:'تعداد زمین',per:'بازی هر زمین در روز',dur:'مدت بازی',rest:'زمان استراحت'})[k]||k} از ${old??'—'} به ${c[k]??'—'} تغییر کرد`);if(sched(t))save()}
function pt(k,v){const t=cur(),old=t.pts[k];t.pts[k]=+v;if(+old!==+v)logSetting(t,'امتیازدهی','تنظیمات مسابقه',`امتیاز ${({w:'برد',d:'مساوی',l:'باخت',u:'ترتیب تفاضل'})[k]||k} از ${old} به ${v} تغییر کرد`);save()}
function rs(){const t=cur();if(sched(t)){save();S.tab='m';render();toast('برنامه دوباره چیده شد')}}
function rd(){const t=cur();if(S.cf!=='rd'){S.cf='rd';return render()}const n=[...new Set($('#et').value.split('\n').map(s=>s.trim()).filter(Boolean))];if(n.length<2){S.cf='';render();return toast('حداقل دو نام لازم است')}
t.teams=n;draw(t);sched(t);save();S.cf='';S.tab='m';render();toast('قرعه‌کشی مجدد انجام شد')}
function del(){if(S.cf!=='del'){S.cf='del';return render()}const t=cur();snap(t,'حذف مسابقه');S.del[t.id]=Date.now();S.tours=S.tours.filter(x=>x.id!==S.cur);delete LAST[t.id];S.cur=null;S.cf='';save();render();toast('مسابقه حذف شد؛ از «تنظیمات ← نسخه‌های قبلی» برمی‌گردد')}
function render(){datePickCloseAll();$('#app').innerHTML=(S.cur&&cur()?(S.pub?pubv(cur()):detail()):home())+updateNotice()}
boot();render();
</script></body></html>
